<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Illustration av en lastväxlare som ställer av en container" preserveAspectRatio="xMidYMid meet"><style>
    .bil,.last,.hjul{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
    .bil{animation-name:kor}
    .last{animation-name:avlast;transform-origin:776px 470px}
    .hjul{animation-name:rull}
    .h1{transform-origin:368px 486px}.h2{transform-origin:690px 486px}.h3{transform-origin:764px 486px}
    @keyframes kor{0%{transform:translateX(900px)}18%,26%{transform:translateX(0)}
      55%,60%{transform:translateX(-200px)}80%,100%{transform:translateX(-1100px)}}
    @keyframes rull{0%{transform:rotate(0)}18%,26%{transform:rotate(-2148deg)}
      55%,60%{transform:rotate(-2625deg)}80%,100%{transform:rotate(-4773deg)}}
    @keyframes avlast{
      0%{transform:translateX(900px);opacity:1}
      18%,26%{transform:translateX(0) rotate(0)}
      40%{transform:translate(70px,54px) rotate(16deg)}
      55%{transform:translate(120px,60px) rotate(0)}
      88%{transform:translate(120px,60px) rotate(0);opacity:1}
      96%,100%{transform:translate(120px,60px) rotate(0);opacity:0}}
     @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="800" fill="#F4F3F0"/><circle cx="960" cy="180" r="96" fill="#A9552A" opacity=".16"/><rect x="0" y="564" width="1200" height="236" fill="#C3CDD5" opacity=".5"/><rect x="0" y="560" width="1200" height="6" fill="#93A3AF"/><g transform="translate(600,430) scale(1.3) translate(-600,-430)"><g class="last"><path d="M560 470 V352 h216 v118 z" fill="#A9552A"/><path d="M560 352 l16 -20 h184 l16 20 z" fill="#C97A4B"/><rect x="591" y="362" width="10" height="98" fill="#C97A4B" opacity=".5"/><rect x="627" y="362" width="10" height="98" fill="#C97A4B" opacity=".5"/><rect x="663" y="362" width="10" height="98" fill="#C97A4B" opacity=".5"/><rect x="699" y="362" width="10" height="98" fill="#C97A4B" opacity=".5"/><rect x="735" y="362" width="10" height="98" fill="#C97A4B" opacity=".5"/></g><g class="bil"><path d="M434 470 V386 h-74 l-30 42 v42 z" fill="#052942"/><rect x="372" y="400" width="46" height="30" fill="#17506F"/><rect x="326" y="440" width="8" height="10" fill="#E0A97C"/><rect x="434" y="452" width="366" height="18" fill="#052942"/><path d="M452 452 v-22 h300 v22 z" fill="#0E3A5A"/><path d="M470 430 q80 -60 250 -52" fill="none" stroke="#6C8091" stroke-width="9" stroke-linecap="round"/><g class="hjul h1"><circle cx="368" cy="486" r="24" fill="#052942"/><circle cx="368" cy="486" r="9" fill="#C3CDD5"/><rect x="353" y="484" width="30" height="4" fill="#C3CDD5"/></g><g class="hjul h2"><circle cx="690" cy="486" r="24" fill="#052942"/><circle cx="690" cy="486" r="9" fill="#C3CDD5"/><rect x="675" y="484" width="30" height="4" fill="#C3CDD5"/></g><g class="hjul h3"><circle cx="764" cy="486" r="24" fill="#052942"/><circle cx="764" cy="486" r="9" fill="#C3CDD5"/><rect x="749" y="484" width="30" height="4" fill="#C3CDD5"/></g></g></g></svg>